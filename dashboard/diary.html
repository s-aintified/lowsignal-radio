<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diary — My Little Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <nav class="topnav">
      <a class="brand" href="index.html">✨ My Little Dashboard</a>
      <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="finance.html">💸 Finance</a>
        <a href="diary.html">📔 Diary</a>
      </div>
      <div class="nav-tools">
        <button id="calm-toggle" class="icon-btn" title="Toggle calm mode (less motion)" aria-pressed="false">🎐</button>
        <button id="theme-toggle" class="icon-btn" title="Toggle light/dark theme">🌙</button>
      </div>
    </nav>

    <header>
      <h1 class="page-title">📔 Diary</h1>
      <p class="subtitle">A private little notebook for how you're feeling. No pressure to write much.</p>
    </header>

    <div class="card">
      <h2>📝 New entry</h2>
      <form id="entry-form">
        <div class="field">
          <label>Mood</label>
          <div class="mood-picker" id="mood-picker" role="group" aria-label="Choose a mood">
            <button type="button" class="mood-btn" data-mood="😊" aria-pressed="false" title="Happy">😊</button>
            <button type="button" class="mood-btn" data-mood="😌" aria-pressed="false" title="Calm">😌</button>
            <button type="button" class="mood-btn" data-mood="😐" aria-pressed="false" title="Neutral">😐</button>
            <button type="button" class="mood-btn" data-mood="😣" aria-pressed="false" title="Stressed">😣</button>
            <button type="button" class="mood-btn" data-mood="😢" aria-pressed="false" title="Sad">😢</button>
            <button type="button" class="mood-btn" data-mood="😴" aria-pressed="false" title="Tired">😴</button>
            <button type="button" class="mood-btn" data-mood="🥳" aria-pressed="false" title="Excited">🥳</button>
          </div>
        </div>
        <div class="field">
          <label for="entry-title">Title (optional)</label>
          <input type="text" id="entry-title" placeholder="Give this entry a name">
        </div>
        <div class="field">
          <label for="entry-body">What's on your mind?</label>
          <textarea id="entry-body" placeholder="Write as much or as little as you like..."></textarea>
        </div>
        <div class="field">
          <label for="entry-tags">Tags (optional, comma separated)</label>
          <input type="text" id="entry-tags" placeholder="e.g. work, good day, sensory">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">✅ Save entry</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.6rem;">
        <h2 style="margin:0;">📚 Your entries</h2>
      </div>
      <div class="form-row" style="margin: 0.9rem 0;">
        <div class="field" style="margin-bottom:0;">
          <label for="search-box">Search</label>
          <input type="text" id="search-box" placeholder="Search titles or text...">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="mood-filter">Filter by mood</label>
          <select id="mood-filter">
            <option value="">All moods</option>
            <option value="😊">😊 Happy</option>
            <option value="😌">😌 Calm</option>
            <option value="😐">😐 Neutral</option>
            <option value="😣">😣 Stressed</option>
            <option value="😢">😢 Sad</option>
            <option value="😴">😴 Tired</option>
            <option value="🥳">🥳 Excited</option>
          </select>
        </div>
      </div>
      <div id="entry-list"></div>
    </div>

    <footer class="note">Your entries stay on this device — nothing is uploaded anywhere.</footer>
  </div>

  <div id="toast-region" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="diary.js"></script>
</body>
</html>
