<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOW SIGNAL — Rumor Broadcast Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Caveat:wght@500;600&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     LOW SIGNAL — site design tokens (mirrors Experiment 777)
     ============================================================ */
  :root,
  [data-theme="dark"]{
    --bg: #0A0A0A;
    --card-rgb: 10,10,10;
    --ink: #E4E6EA;
    --ink-soft: #9498A0;
    --border: #1D1D1F;
    --placeholder: #3A3D42;
    --cyan: #5FC9D6;
    --violet: #7A6FC4;
    --violet-lt: #9A8FE0;
    --amber: #D98E3B;
    --live: #5AC88C;
    --rose: #E85E7A;
    --card-op: 0.80;

    --hair-02: rgba(255,255,255,.02);
    --hair-03: rgba(255,255,255,.03);
    --hair-035: rgba(255,255,255,.035);
    --hair-04: rgba(255,255,255,.04);
    --hair-045: rgba(255,255,255,.045);
    --hair-05: rgba(255,255,255,.05);
    --hair-06: rgba(255,255,255,.06);
    --amber-text: var(--amber);

    --g1: 217,142,59;
    --g2: 122,111,196;
    --g3: 95,201,214;
  }
  [data-theme="light"]{
    --bg: #EFF1F2;
    --card-rgb: 255,255,255;
    --ink: #1A1C1E;
    --ink-soft: #5C6066;
    --border: #D5D8DA;
    --placeholder: #C9CCCF;
    --cyan: #2B94A3;
    --violet: #574C9E;
    --violet-lt: #6E60B8;
    --amber: #A9660F;
    --live: #2E9160;
    --rose: #C23A5A;
    --card-op: 0.92;

    --hair-02: rgba(0,0,0,.035);
    --hair-03: rgba(0,0,0,.045);
    --hair-035: rgba(0,0,0,.05);
    --hair-04: rgba(0,0,0,.055);
    --hair-045: rgba(0,0,0,.06);
    --hair-05: rgba(0,0,0,.07);
    --hair-06: rgba(0,0,0,.08);
    --amber-text: #101010;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100%;
    transition:background .15s ease, color .15s ease;
  }
  a{color:inherit;}

  .ls-wrap{
    max-width:880px;
    margin:24px auto;
    padding:26px;
  }

  /* ===== Header banner ===== */
  .ls-banner{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--border);
    height:170px;
    background:
      linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.75)),
      url("images/radio-header.png.jpg") center/cover;
  }
  [data-theme="light"] .ls-banner{
    background:
      linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.6)),
      url("images/radio-header.png.jpg") center/cover;
  }
  .ls-banner-inner{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 20px;
  }
  .ls-callsign{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:rgba(255,255,255,.65);
    margin-bottom:8px;
  }
  .ls-title{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:#fff;
    margin:0;
    animation:ls-flicker 4.4s infinite;
  }
  .ls-title .tag{
    display:block;
    font-family:'Caveat', cursive;
    font-weight:600;
    font-size:18px;
    color:rgb(var(--g1));
    text-transform:none;
    letter-spacing:0;
    margin-top:4px;
  }
  @keyframes ls-flicker{
    0%,19%,21%,23%,25%,54%,56%,100%{opacity:1;}
    20%,22%,24%,55%{opacity:.55;}
  }
  .ls-theme-toggle{
    position:absolute;
    top:12px;
    right:12px;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.2);
    color:#fff;
    width:32px;
    height:32px;
    border-radius:50%;
    cursor:pointer;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(3px);
  }
  .ls-theme-toggle:hover{border-color:var(--amber);}

  /* ===== Player card ===== */
  .ls-player{
    margin-top:18px;
    display:grid;
    grid-template-columns:132px 1fr;
    gap:18px;
    padding:18px;
    background:rgba(var(--card-rgb), var(--card-op));
    border:1px solid var(--border);
    border-radius:18px;
  }
  @media(max-width:560px){
    .ls-player{grid-template-columns:1fr; text-align:center;}
  }

  .ls-art{
    position:relative;
    width:132px;
    height:132px;
    border-radius:14px;
    overflow:hidden;
    background:var(--hair-03);
    border:1px solid var(--border);
    flex-shrink:0;
  }
  @media(max-width:560px){ .ls-art{margin:0 auto;} }
  .ls-art img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(1.05);
  }
  .ls-art-ring{
    position:absolute;
    inset:-2px;
    border-radius:16px;
    border:2px solid transparent;
    pointer-events:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .ls-player.is-playing .ls-art-ring{
    border-color:rgb(var(--g1));
    box-shadow:0 0 0 1px rgba(var(--g1),.4), 0 0 22px rgba(var(--g2),.35);
    animation:ls-art-pulse 2.2s ease-in-out infinite;
  }
  @keyframes ls-art-pulse{
    0%,100%{box-shadow:0 0 0 1px rgba(var(--g1),.4), 0 0 22px rgba(var(--g2),.25);}
    50%{box-shadow:0 0 0 1px rgba(var(--g1),.6), 0 0 30px rgba(var(--g2),.45);}
  }

  .ls-meta{min-width:0;}
  .ls-onair{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid rgba(90,200,140,.5);
    border-radius:20px;
    padding:3px 10px;
    font-family:'Space Mono', monospace;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--live);
    margin-bottom:10px;
  }
  .ls-onair .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--live);
  }
  .ls-player.is-playing .ls-onair .dot{
    animation:ls-livepulse 1.6s ease-in-out infinite;
  }
  @keyframes ls-livepulse{
    0%,100%{box-shadow:0 0 4px 1px rgba(90,200,140,.7); opacity:1;}
    50%{box-shadow:0 0 10px 4px rgba(90,200,140,.35); opacity:.7;}
  }

  .ls-track-title{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:16px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ls-track-artist{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    color:var(--ink-soft);
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* VU bars */
  .ls-vu{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:16px;
    margin-top:10px;
  }
  @media(max-width:560px){ .ls-vu{justify-content:center;} }
  .ls-vu span{
    width:3px;
    height:30%;
    border-radius:2px;
    background:linear-gradient(180deg, rgb(var(--g1)), rgb(var(--g2)));
    opacity:.35;
    transition:opacity .2s ease;
  }
  .ls-player.is-playing .ls-vu span{
    opacity:1;
    animation:ls-vu-bounce .9s ease-in-out infinite;
  }
  .ls-vu span:nth-child(1){animation-delay:0s;}
  .ls-vu span:nth-child(2){animation-delay:.12s;}
  .ls-vu span:nth-child(3){animation-delay:.24s;}
  .ls-vu span:nth-child(4){animation-delay:.36s;}
  .ls-vu span:nth-child(5){animation-delay:.18s;}
  .ls-vu span:nth-child(6){animation-delay:.3s;}
  @keyframes ls-vu-bounce{
    0%,100%{height:25%;}
    50%{height:100%;}
  }

  /* progress + controls */
  .ls-progress-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
  }
  .ls-time{
    font-family:'Space Mono', monospace;
    font-size:9.5px;
    color:var(--ink-soft);
    min-width:32px;
  }
  .ls-time.end{text-align:right;}
  .ls-scrub{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:4px;
    border-radius:4px;
    background:var(--hair-05);
    outline:none;
    cursor:pointer;
  }
  .ls-scrub::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;height:12px;border-radius:50%;
    background:rgb(var(--g1));
    box-shadow:0 0 6px rgba(var(--g1),.6);
    cursor:pointer;
  }
  .ls-scrub::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;border:0;
    background:rgb(var(--g1));
    cursor:pointer;
  }

  .ls-controls-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  @media(max-width:560px){ .ls-controls-row{justify-content:center;} }

  .ls-ctrl-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:32px;height:32px;
    border-radius:50%;
    background:var(--hair-03);
    border:1px solid var(--border);
    color:var(--ink-soft);
    cursor:pointer;
    font-size:13px;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .ls-ctrl-btn:hover{border-color:var(--amber); color:var(--amber-text);}
  .ls-ctrl-btn:disabled{opacity:.35; cursor:default;}
  .ls-ctrl-btn:disabled:hover{border-color:var(--border); color:var(--ink-soft);}

  .ls-play-btn{
    width:44px;height:44px;
    background:linear-gradient(120deg, rgb(var(--g1)), rgb(var(--g2)), rgb(var(--g3)));
    color:#101010;
    border:0;
    font-size:15px;
  }
  .ls-play-btn:hover{filter:brightness(1.08); color:#101010;}

  .ls-vol-wrap{
    display:flex;
    align-items:center;
    gap:6px;
    margin-left:auto;
  }
  @media(max-width:560px){ .ls-vol-wrap{margin-left:0;} }
  .ls-vol{
    -webkit-appearance:none;
    appearance:none;
    width:70px;
    height:4px;
    border-radius:4px;
    background:var(--hair-05);
    outline:none;
    cursor:pointer;
  }
  .ls-vol::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:10px;height:10px;border-radius:50%;
    background:var(--ink-soft);
    cursor:pointer;
  }
  .ls-vol::-moz-range-thumb{
    width:10px;height:10px;border-radius:50%;border:0;
    background:var(--ink-soft);
    cursor:pointer;
  }

  .ls-yt-note{
    font-family:'Space Mono', monospace;
    font-size:9px;
    letter-spacing:.06em;
    color:var(--placeholder);
    margin-top:10px;
  }
  .ls-yt-note a{color:var(--ink-soft); text-decoration:underline;}

  /* hidden YT iframe host */
  #ytHost{
    position:absolute;
    width:1px;height:1px;
    opacity:0;
    overflow:hidden;
    pointer-events:none;
  }

  /* ===== action row ===== */
  .ls-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin:18px 0;
  }
  .ls-btn{
    background:var(--hair-03);
    border:1px solid var(--border);
    color:var(--ink-soft);
    padding:10px 18px;
    border-radius:20px;
    cursor:pointer;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .ls-btn:hover{border-color:var(--amber); color:var(--amber-text); background:rgba(217,142,59,0.08);}
  .ls-btn.grad{
    background:linear-gradient(120deg, rgb(var(--g1)), rgb(var(--g2)), rgb(var(--g3)));
    border-color:transparent;
    color:#101010;
    font-weight:700;
  }
  .ls-btn.grad:hover{filter:brightness(1.06); color:#101010;}

  /* ===== rumor feed ===== */
  .ls-feed-head{
    position:relative;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:16px;
    padding-bottom:10px;
  }
  .ls-feed-head::after{
    content:"";
    position:absolute;
    left:50%; bottom:0;
    transform:translateX(-50%);
    width:60px; height:2px;
    border-radius:2px;
    background:linear-gradient(90deg, rgb(var(--g1)), rgb(var(--g2)), rgb(var(--g3)));
  }
  #rumor-feed{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .ls-rumor-loading, .ls-rumor-empty{
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    color:var(--placeholder);
    padding:20px 0;
  }
  .ls-rumor-row{
    position:relative;
    background:var(--hair-02);
    border:1px solid var(--border);
    border-left:3px solid rgb(var(--g1));
    border-radius:10px 12px 12px 10px;
    padding:12px 14px;
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    line-height:1.55;
    color:var(--ink-soft);
    opacity:0;
    transform:translateY(6px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .ls-rumor-row.show{
    opacity:1;
    transform:translateY(0);
  }
  .ls-rumor-row .who{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--amber-text);
    margin-right:6px;
  }
  .ls-rumor-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    margin-bottom:4px;
  }
  .ls-rumor-time{
    font-family:'Space Mono', monospace;
    font-size:9px;
    letter-spacing:.04em;
    color:var(--placeholder);
    white-space:nowrap;
    flex-shrink:0;
  }
  .ls-rumor-msg{display:block;}
  .ls-rumor-reactions{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .ls-react-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:var(--hair-03);
    border:1px solid var(--border);
    border-radius:14px;
    padding:3px 9px;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .ls-react-btn:hover{border-color:rgb(var(--g1)); background:rgba(var(--g1),.1);}
  .ls-react-btn:active{transform:scale(.94);}
  .ls-react-btn.reacted{
    border-color:rgb(var(--g1));
    background:rgba(var(--g1),.16);
    color:var(--ink);
  }
  .ls-react-btn .count{font-weight:700;}

  /* ===== floating now-playing badge ===== */
  .ls-float-badge{
    position:fixed;
    right:16px;
    bottom:16px;
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(var(--card-rgb), .96);
    border:1px solid var(--border);
    border-radius:40px;
    padding:8px 14px 8px 8px;
    box-shadow:0 10px 26px rgba(0,0,0,.3), 0 0 0 1px rgba(var(--g1),.25);
    opacity:0;
    transform:translateY(12px) scale(.96);
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:500;
    max-width:min(300px, calc(100vw - 32px));
  }
  .ls-float-badge.show{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }
  .ls-float-play{
    flex-shrink:0;
    width:34px;height:34px;
    border-radius:50%;
    border:0;
    background:linear-gradient(120deg, rgb(var(--g1)), rgb(var(--g2)), rgb(var(--g3)));
    color:#101010;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ls-float-play:hover{filter:brightness(1.08);}
  .ls-float-meta{min-width:0;}
  .ls-float-title{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:12px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:200px;
  }
  .ls-float-onair{
    display:flex;
    align-items:center;
    gap:5px;
    font-family:'Space Mono', monospace;
    font-size:8.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .ls-float-onair .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--placeholder);
  }
  .ls-float-badge.is-playing .ls-float-onair .dot{
    background:var(--live);
    animation:ls-livepulse 1.6s ease-in-out infinite;
  }

  @media (max-width:600px){
    .ls-wrap{padding:16px;}
    .ls-banner{height:150px;}
    .ls-title{font-size:20px;}
    .ls-float-badge{right:10px; bottom:10px;}
  }
</style>
</head>
<body>

<div class="ls-wrap">

  <div class="ls-banner">
    <button class="ls-theme-toggle" id="themeToggle" title="toggle theme" type="button">🌙</button>
    <div class="ls-banner-inner">
      <div class="ls-callsign">LWSGNL · 91.4 FM · frequency of the unverified</div>
      <h1 class="ls-title">Low Signal<span class="tag">rumor broadcast radio</span></h1>
    </div>
  </div>

  <div class="ls-player" id="player">
    <div class="ls-art">
      <img id="artImg" src="https://i.etsystatic.com/50459052/r/il/46638d/7030410083/il_794xN.7030410083_dtco.jpg" alt="now playing">
      <div class="ls-art-ring"></div>
    </div>
    <div class="ls-meta">
      <span class="ls-onair"><span class="dot"></span> On Air</span>
      <div class="ls-track-title" id="trackTitle">tuning in…</div>
      <div class="ls-track-artist" id="trackArtist">&nbsp;</div>
      <div class="ls-vu">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="ls-progress-row">
        <span class="ls-time" id="timeCurrent">0:00</span>
        <input type="range" class="ls-scrub" id="scrub" min="0" max="100" value="0" step="0.1">
        <span class="ls-time end" id="timeTotal">0:00</span>
      </div>

      <div class="ls-controls-row">
        <button class="ls-ctrl-btn" id="prevBtn" title="previous track">⏮</button>
        <button class="ls-ctrl-btn ls-play-btn" id="playBtn" title="play/pause">▶</button>
        <button class="ls-ctrl-btn" id="nextBtn" title="next track">⏭</button>
        <div class="ls-vol-wrap">
          <button class="ls-ctrl-btn" id="muteBtn" title="mute" style="width:26px;height:26px;font-size:11px;">🔊</button>
          <input type="range" class="ls-vol" id="volSlider" min="0" max="100" value="70">
        </div>
      </div>

      <div class="ls-yt-note" id="ytNote" style="display:none;"></div>
    </div>
  </div>

  <div id="ytHost"></div>

  <div class="ls-float-badge" id="floatBadge">
    <button class="ls-float-play" id="floatPlayBtn" title="play/pause" type="button">▶</button>
    <div class="ls-float-meta">
      <div class="ls-float-title" id="floatTitle">not playing</div>
      <div class="ls-float-onair"><span class="dot"></span> low signal radio</div>
    </div>
  </div>

  <div class="ls-actions">
    <a class="ls-btn" id="refreshBtn" href="#">🔁 refresh broadcast</a>
    <a class="ls-btn grad" href="https://docs.google.com/forms/d/e/1FAIpQLSdbMi_JxnxC-MEh3mqloi7klYWuROP1FHQEEtCpzBd8mzJu2w/viewform" target="_blank" rel="noopener">➕ submit rumor</a>
  </div>

  <div class="ls-feed-head">broadcast log</div>
  <section id="rumor-feed">
    <div class="ls-rumor-loading">loading broadcast log…</div>
  </section>

</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* ===== SITE THEME (dark/light) — shares the same key as the main wrapper ===== */
(function(){
  const saved = localStorage.getItem('site-theme');
  document.documentElement.setAttribute('data-theme', (saved === 'light' || saved === 'dark') ? saved : 'dark');
  const btn = document.getElementById('themeToggle');
  function paintIcon(){
    btn.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '☀️' : '🌙';
  }
  paintIcon();
  btn.addEventListener('click', ()=>{
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('site-theme', next);
    paintIcon();
  });
})();

/* ===== RADIO PLAYER (YouTube IFrame API) ===== */
(function(){
  // Playlist — add more video IDs here as you build one out.
  // Playlist mode: point straight at a real YouTube playlist. Prev/Next,
  // auto-advance, and looping are all handled natively by the YouTube
  // player — add/reorder tracks in the playlist itself, no code edits needed.
  const PLAYLIST_ID = 'PLDIoUOhQQPlWc-Kd6TCjTRIl0Z6fSQV0X';

  // Fallback single-track mode, only used if PLAYLIST_ID above is set to ''.
  const VIDEO_IDS = ['fTKqtvXjkvo'];

  const usePlaylist = !!PLAYLIST_ID;

  let ytPlayer = null;
  let currentIndex = 0;
  let isReady = false;
  let scrubbing = false;
  let pollTimer = null;
  let currentWatchUrl = usePlaylist ? `https://www.youtube.com/playlist?list=${PLAYLIST_ID}` : '';
  let erroredIds = new Set();
  let errorStreak = 0;

  const IDLE_ART_URL = 'https://i.etsystatic.com/50459052/r/il/46638d/7030410083/il_794xN.7030410083_dtco.jpg';
  const ORIGINAL_TITLE = document.title;

  const playerEl = document.getElementById('player');
  const artImg = document.getElementById('artImg');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const muteBtn = document.getElementById('muteBtn');
  const volSlider = document.getElementById('volSlider');
  const scrub = document.getElementById('scrub');
  const timeCurrent = document.getElementById('timeCurrent');
  const timeTotal = document.getElementById('timeTotal');
  const ytNote = document.getElementById('ytNote');
  const floatBadge = document.getElementById('floatBadge');
  const floatPlayBtn = document.getElementById('floatPlayBtn');
  const floatTitle = document.getElementById('floatTitle');

  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  function setIdleArt(){
    artImg.src = IDLE_ART_URL;
  }

  function loadArt(videoId){
    if(!videoId) return;
    artImg.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
    if(!usePlaylist) currentWatchUrl = `https://www.youtube.com/watch?v=${videoId}`;
    ytNote.style.display = 'none';
    ytNote.innerHTML = '';
  }

  function updateNavButtons(){
    const multi = usePlaylist || VIDEO_IDS.length > 1;
    prevBtn.disabled = !multi;
    nextBtn.disabled = !multi;
  }

  window.onYouTubeIframeAPIReady = function(){
    if(!usePlaylist) loadArt(VIDEO_IDS[currentIndex]);
    const baseConfig = {
      height: '1',
      width: '1',
      playerVars: Object.assign({
        autoplay: 0,
        controls: 0,
        modestbranding: 1,
        rel: 0,
        playsinline: 1
      }, usePlaylist ? { listType: 'playlist', list: PLAYLIST_ID, loop: 1 } : {}),
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange,
        onError: onPlayerError
      }
    };
    if(!usePlaylist){ baseConfig.videoId = VIDEO_IDS[currentIndex]; }
    ytPlayer = new YT.Player('ytHost', baseConfig);
  };

  function onPlayerReady(){
    isReady = true;
    ytPlayer.setVolume(Number(volSlider.value));
    updateMetaFromPlayer();
    updateNavButtons();
    setIdleArt();
  }

  function updateMetaFromPlayer(){
    let title = 'now broadcasting';
    try{
      const data = ytPlayer.getVideoData();
      title = data && data.title ? data.title : 'now broadcasting';
      trackTitle.textContent = title;
      trackArtist.textContent = data && data.author ? data.author : '\u00A0';
      if(usePlaylist && data && data.video_id && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING){
        loadArt(data.video_id);
      }
    }catch(e){
      trackTitle.textContent = 'now broadcasting';
    }
    const dur = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
    timeTotal.textContent = fmtTime(dur);
    scrub.max = dur || 100;
    floatTitle.textContent = title;
  }

  function onPlayerStateChange(e){
    const state = e.data;
    if(state === YT.PlayerState.PLAYING){
      errorStreak = 0;
      playerEl.classList.add('is-playing');
      floatBadge.classList.add('is-playing');
      playBtn.textContent = '⏸';
      floatPlayBtn.textContent = '⏸';
      updateMetaFromPlayer();
      startPolling();
      document.title = `▶ ${trackTitle.textContent} — LOW SIGNAL`;
    } else if(state === YT.PlayerState.PAUSED){
      playerEl.classList.remove('is-playing');
      floatBadge.classList.remove('is-playing');
      playBtn.textContent = '▶';
      floatPlayBtn.textContent = '▶';
      stopPolling();
      setIdleArt();
      document.title = ORIGINAL_TITLE;
    } else if(state === YT.PlayerState.ENDED){
      goNext();
    } else if(state === YT.PlayerState.CUED){
      updateMetaFromPlayer();
      setIdleArt();
    }
  }

  function onPlayerError(e){
    playerEl.classList.remove('is-playing');
    floatBadge.classList.remove('is-playing');
    playBtn.textContent = '▶';
    floatPlayBtn.textContent = '▶';
    stopPolling();
    setIdleArt();
    document.title = ORIGINAL_TITLE;
    errorStreak++;

    // codes 101/150 = embedding disabled by the uploader; 100 = removed/private; 2 = bad id
    if(usePlaylist){
      if(errorStreak <= 5){
        trackTitle.textContent = 'skipping unplayable track…';
        trackArtist.textContent = '\u00A0';
        setTimeout(goNext, 900);
      } else {
        trackTitle.textContent = 'too many tracks failed in a row';
        trackArtist.textContent = 'check the playlist directly';
        ytNote.style.display = 'block';
        ytNote.innerHTML = `<a href="${currentWatchUrl}" target="_blank" rel="noopener">open the playlist on youtube ↗</a>`;
      }
      return;
    }

    const failedId = VIDEO_IDS[currentIndex];
    erroredIds.add(failedId);
    const stillGood = VIDEO_IDS.filter(id => !erroredIds.has(id));
    if(stillGood.length){
      trackTitle.textContent = 'skipping unplayable track…';
      trackArtist.textContent = '\u00A0';
      setTimeout(goNext, 900);
    } else {
      trackTitle.textContent = 'this track can\u2019t play inline';
      trackArtist.textContent = 'its owner disabled outside playback';
      ytNote.style.display = 'block';
      ytNote.innerHTML = `try a different track, or <a href="${currentWatchUrl}" target="_blank" rel="noopener">watch this one on youtube ↗</a>`;
    }
  }

  function startPolling(){
    stopPolling();
    pollTimer = setInterval(()=>{
      if(!isReady || scrubbing) return;
      const cur = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
      const dur = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
      timeCurrent.textContent = fmtTime(cur);
      if(dur){
        timeTotal.textContent = fmtTime(dur);
        scrub.max = dur;
        scrub.value = cur;
      }
    }, 500);
  }
  function stopPolling(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }

  function playPause(){
    if(!isReady) return;
    const state = ytPlayer.getPlayerState();
    if(state === YT.PlayerState.PLAYING){
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  }

  function goNext(){
    if(!isReady) return;
    if(usePlaylist){
      ytPlayer.nextVideo();
      return;
    }
    if(VIDEO_IDS.length < 2){
      ytPlayer.seekTo(0); ytPlayer.playVideo();
      return;
    }
    currentIndex = (currentIndex + 1) % VIDEO_IDS.length;
    loadArt(VIDEO_IDS[currentIndex]);
    ytPlayer.loadVideoById(VIDEO_IDS[currentIndex]);
  }
  function goPrev(){
    if(!isReady) return;
    if(usePlaylist){
      ytPlayer.previousVideo();
      return;
    }
    if(VIDEO_IDS.length < 2){
      ytPlayer.seekTo(0); ytPlayer.playVideo();
      return;
    }
    currentIndex = (currentIndex - 1 + VIDEO_IDS.length) % VIDEO_IDS.length;
    loadArt(VIDEO_IDS[currentIndex]);
    ytPlayer.loadVideoById(VIDEO_IDS[currentIndex]);
  }

  playBtn.addEventListener('click', playPause);
  nextBtn.addEventListener('click', goNext);
  prevBtn.addEventListener('click', goPrev);

  muteBtn.addEventListener('click', ()=>{
    if(!isReady) return;
    if(ytPlayer.isMuted()){
      ytPlayer.unMute();
      muteBtn.textContent = '🔊';
    } else {
      ytPlayer.mute();
      muteBtn.textContent = '🔇';
    }
  });

  volSlider.addEventListener('input', ()=>{
    if(!isReady) return;
    const v = Number(volSlider.value);
    ytPlayer.setVolume(v);
    if(v === 0){
      muteBtn.textContent = '🔇';
    } else {
      if(ytPlayer.isMuted()) ytPlayer.unMute();
      muteBtn.textContent = '🔊';
    }
  });

  scrub.addEventListener('mousedown', ()=>{ scrubbing = true; });
  scrub.addEventListener('touchstart', ()=>{ scrubbing = true; });
  scrub.addEventListener('input', ()=>{
    timeCurrent.textContent = fmtTime(Number(scrub.value));
  });
  function commitScrub(){
    if(!isReady) return;
    ytPlayer.seekTo(Number(scrub.value), true);
    scrubbing = false;
  }
  scrub.addEventListener('change', commitScrub);
  scrub.addEventListener('mouseup', ()=>{ setTimeout(()=>{ scrubbing = false; }, 50); });
  scrub.addEventListener('touchend', ()=>{ setTimeout(()=>{ scrubbing = false; }, 50); });

  // floating badge: shows once the main player scrolls out of view,
  // so playback can still be controlled from further down the page
  floatPlayBtn.addEventListener('click', playPause);
  if('IntersectionObserver' in window){
    const playerObserver = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        floatBadge.classList.toggle('show', !entry.isIntersecting);
      });
    }, { threshold: 0 });
    playerObserver.observe(playerEl);
  }
})();

/* ===== RUMOR FEED ===== */
(function(){
  const sheetURL = 'https://docs.google.com/spreadsheets/d/1ycfipQTU9ffFt-wwjnNjezL6XSO0eMSmaReiZh-I7VQ/gviz/tq?tqx=out:json';

  // Paste your deployed Google Apps Script web app URL here to turn on
  // shared public reactions. Leave blank and reactions just show as "–".
  const REACTIONS_API_URL = 'https://script.google.com/macros/s/AKfycbxbm7FhW5p43uScym12AZYUs7UiWFiv6w4K01a4M-XxXwdTDpeW0ltXM5DbLt8Jdo1i/exec';

  const REACTIONS = [
    { type: 'fire',  emoji: '🔥' },
    { type: 'eyes',  emoji: '👀' },
    { type: 'skull', emoji: '💀' }
  ];

  const feed = document.getElementById('rumor-feed');
  const refreshBtn = document.getElementById('refreshBtn');
  let reactionCounts = {}; // rumorId -> {fire, eyes, skull}
  let reactedHere = {};    // localStorage-backed: what THIS browser already clicked

  try{
    reactedHere = JSON.parse(localStorage.getItem('lowSignalRadio_reacted') || '{}');
  }catch(e){ reactedHere = {}; }

  function saveReactedHere(){
    try{ localStorage.setItem('lowSignalRadio_reacted', JSON.stringify(reactedHere)); }catch(e){}
  }

  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // stable short id from timestamp+alias+message so the same rumor
  // gets the same id across reloads, without needing real database rows
  function hashId(str){
    let h = 5381;
    for(let i=0;i<str.length;i++){
      h = ((h << 5) + h) + str.charCodeAt(i);
      h = h & h;
    }
    return (h >>> 0).toString(36);
  }

  function parseGvizDate(raw){
    if(typeof raw !== 'string') return null;
    const m = raw.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
    if(!m) return null;
    const nums = m.slice(1).map(v => v === undefined ? 0 : Number(v));
    const [y, mo, d, h, mi, s] = nums;
    return new Date(y, mo, d, h, mi, s);
  }

  function relativeTime(date){
    if(!date || isNaN(date.getTime())) return '';
    const diff = (Date.now() - date.getTime()) / 1000;
    if(diff < 45) return 'just now';
    if(diff < 3600) return Math.max(1, Math.floor(diff/60)) + 'm ago';
    if(diff < 86400) return Math.floor(diff/3600) + 'h ago';
    if(diff < 604800) return Math.floor(diff/86400) + 'd ago';
    return date.toLocaleDateString();
  }

  function fetchReactionCounts(){
    if(!REACTIONS_API_URL) return Promise.resolve({});
    // cache-bust: browsers can otherwise cache this GET and show stale (empty) counts
    const bustedUrl = REACTIONS_API_URL + (REACTIONS_API_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
    return fetch(bustedUrl, { cache: 'no-store' })
      .then(res => res.json())
      .catch(()=> ({}));
  }

  function sendReaction(rumorId, type, action){
    if(!REACTIONS_API_URL) return Promise.resolve(null);
    return fetch(REACTIONS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
      body: JSON.stringify({ rumorId, type, action })
    })
      .then(res => res.json())
      .catch(()=> null);
  }

  function renderReactionButtons(rumorId){
    const counts = reactionCounts[rumorId] || {};
    const mine = reactedHere[rumorId] || {};
    return REACTIONS.map(r => {
      const n = counts[r.type];
      const displayCount = (typeof n === 'number') ? n : (REACTIONS_API_URL ? 0 : '–');
      const isReacted = !!mine[r.type];
      return `<button type="button" class="ls-react-btn${isReacted ? ' reacted' : ''}" data-rumor="${rumorId}" data-type="${r.type}">${r.emoji} <span class="count">${displayCount}</span></button>`;
    }).join('');
  }

  function loadFeed(){
    feed.innerHTML = '<div class="ls-rumor-loading">loading broadcast log…</div>';

    Promise.all([
      fetch(sheetURL).then(res => res.text()),
      fetchReactionCounts()
    ]).then(([text, counts]) => {
      reactionCounts = counts || {};
      const json = JSON.parse(text.substr(47).slice(0, -2));
      const rows = json.table.rows;
      feed.innerHTML = '';
      let count = 0;

      rows.reverse().forEach(row => {
        const rawDate = row.c[0] ? row.c[0].v : null;
        const dateFallback = row.c[0] && row.c[0].f ? row.c[0].f : '';
        const alias = row.c[1] ? row.c[1].v : 'Anonymous';
        const message = row.c[2] ? row.c[2].v : '';
        if(!message || !message.trim()) return;
        count++;

        const parsedDate = parseGvizDate(rawDate) || (dateFallback ? new Date(dateFallback) : null);
        const timeLabel = relativeTime(parsedDate) || dateFallback || '';
        const rumorId = hashId(`${rawDate || dateFallback}|${alias}|${message}`);

        const div = document.createElement('div');
        div.className = 'ls-rumor-row';
        div.innerHTML = `
          <div class="ls-rumor-top">
            <span class="who">\u{1F399}\uFE0F ${escapeHTML(alias)}</span>
            <span class="ls-rumor-time">${escapeHTML(timeLabel)}</span>
          </div>
          <span class="ls-rumor-msg">${escapeHTML(message)}</span>
          <div class="ls-rumor-reactions">${renderReactionButtons(rumorId)}</div>
        `;
        feed.appendChild(div);

        // fade the row in, staggered slightly per row for a broadcast-log feel
        requestAnimationFrame(()=>{
          setTimeout(()=>{ div.classList.add('show'); }, Math.min(count, 12) * 35);
        });
      });

      if(!count){
        feed.innerHTML = '<div class="ls-rumor-empty">no rumors on the wire yet — be the first to submit one.</div>';
      }
    }).catch(()=>{
      feed.innerHTML = '<div class="ls-rumor-empty">broadcast log is off the air right now — try refreshing.</div>';
    });
  }

  feed.addEventListener('click', (e)=>{
    const btn = e.target.closest('.ls-react-btn');
    if(!btn) return;
    if(!REACTIONS_API_URL) return; // reactions backend not connected yet

    const rumorId = btn.dataset.rumor;
    const type = btn.dataset.type;
    const countEl = btn.querySelector('.count');

    reactedHere[rumorId] = reactedHere[rumorId] || {};
    const alreadyReacted = !!reactedHere[rumorId][type];
    const action = alreadyReacted ? 'remove' : 'add';

    // optimistic UI: toggle immediately, correct from server response after
    btn.classList.toggle('reacted', !alreadyReacted);
    const current = parseInt(countEl.textContent, 10) || 0;
    countEl.textContent = Math.max(0, current + (alreadyReacted ? -1 : 1));

    if(alreadyReacted){
      delete reactedHere[rumorId][type];
    } else {
      reactedHere[rumorId][type] = true;
    }
    saveReactedHere();

    sendReaction(rumorId, type, action).then(result => {
      // trust the server's real count once it comes back, in case
      // someone else reacted in between or the optimistic guess drifted
      if(result && result[rumorId] && typeof result[rumorId][type] === 'number'){
        countEl.textContent = result[rumorId][type];
        reactionCounts[rumorId] = result[rumorId];
      }
    });
  });

  refreshBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    loadFeed();
  });

  loadFeed();
})();
</script>
